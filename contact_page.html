<!doctype html>
<html>
  <head>
    <style>
      body {
        display: flex;
        justify-content: center;
        min-height: 100vh;
        align-items: center;
      }

      .container {
        height: 200px;
        width: 400px;
        border: solid;
        border-width: 1px black;
      }

      .one-contact-way {
        display: flex;
        flex-direction: row;
        margin-bottom: 0px;
      }
      .logo {
        width: 45px;
        height: 45px;
        margin-top: 14px;
      }

      .dail-logo {
        width: 45px;
        height: 45px;
        margin-top: 14px;
        margin-left: 6px;
      }

      .app-label {
        color: black;
        font-size: 24px;
        margin-left: 8px;
        margin-bottom: 0px;
      }

      .contact-no {
        font-size: 18px;
        margin-top: 30px;
        font-weight: bolder;
      }

      .two-contact-way {
        display: flex;
        flex-direction: row;
      }

      .three-contact-way {
        display: flex;
        flex-direction: row;
      }

      .mail-logo {
        width: 45px;
        height: 45px;
        margin-left: 6px;
        margin-top: 14px;
      }
      .mail-id {
        font-size: 18px;
        margin-top: 30px;
        font-weight: bolder;
      }

      .back-button {
        background-color: black;
        border: none;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="one-contact-way">
        <img class="logo" src="images-big-project/whatsapp.png" />
        <p class="app-label">whatsapp:</p>
        <p class="contact-no">+91 xxxxxxxxxx</p>
      </div>

      <div class="two-contact-way">
        <img class="dail-logo" src="images-big-project/dail.logo.png" />
        <p class="app-label">Dial:</p>
        <p class="contact-no">+91 xxxxxxxxxx</p>
      </div>

      <div class="three-contact-way">
        <img class="mail-logo" src="images-big-project/mail-logo.png" />\
        <p class="app-label">google-mail:</p>
        <p class="mail-id">someone123@gmail.com</p>
      </div>
    </div>
    <button class="back-button">
      <a class="go-back" href="home-page.html" style="color: white">
        go back
      </a>

      <a class="something" href="home-page.html">
        something
      </a>
    </button>
  </body>
</html>
