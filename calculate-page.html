<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="projects-css/calculator.css" />
  </head>
  <body style="background-color: black">
    <div class="header">CALCULATOR-OS.v1K</div>

    <button class="back">
      <a class="back-to-screen" href="karthikeya-os.html"> back</a>
    </button>
    <div class="text-board">
      <div class="textarea"></div>
      <div class="row-one">
        <div class="one">1</div>

        <div class="two">2</div>

        <div class="three">3</div>

        <div class="four">4</div>

        <div class="five">5</div>
      </div>

      <div class="row-two">
        <div class="six">6</div>

        <div class="seven">7</div>

        <div class="eight">8</div>

        <div class="nine">9</div>

        <div class="zero">0</div>
      </div>

      <div class="row-three">
        <div class="percent">%</div>

        <div class="star">*</div>

        <div class="subtract">-</div>

        <div class="add">+</div>

        <div class="divide">/</div>
      </div>
    </div>
  </body>
</html>
